; llama.cpp router-mode preset for Ragstead.
;
; Download the models once:
;   llama-server -hf LiquidAI/LFM3-1.7B-GGUF:Q4_K_M
;   llama-server -hf ggml-org/embeddinggemma-2-GGUF:Q8_0
;
; Then serve both on one port:
;   llama-server --models-preset llama-models.ini --models-max 2 --port 8080

version = 1

[*]
ctx-size = 4096

[LiquidAI/LFM3-1.7B-GGUF:Q4_K_M]
load-on-startup = true
temp = 0.1
top-k = 50
repeat-penalty = 1.1

[ggml-org/embeddinggemma-2-GGUF:Q8_0]
load-on-startup = true
embeddings = true
pooling = mean
ctx-size = 2048
batch-size = 2048
ubatch-size = 2048
