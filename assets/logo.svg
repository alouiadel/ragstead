<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Ragstead logo">
  <defs>
    <pattern id="paper-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3" fill="#241C17" opacity="0.08"/>
    </pattern>
    <clipPath id="tile">
      <rect width="1024" height="1024" rx="220"/>
    </clipPath>
  </defs>

  <!-- Warm paper tile -->
  <rect width="1024" height="1024" rx="220" fill="#F4EAD7"/>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#paper-dots)"/>

    <!-- Retro sunburst -->
    <circle cx="512" cy="472" r="306" fill="#E7B24A"/>
    <g stroke="#C4553B" stroke-width="24" stroke-linecap="round">
      <path d="M512 118 V198"/>
      <path d="M306 196 L356 266"/>
      <path d="M718 196 L668 266"/>
      <path d="M196 400 H276"/>
      <path d="M828 400 H748"/>
    </g>

    <!-- Offset shadow -->
    <g fill="#241C17" opacity="0.20">
      <path d="M512 262 L812 476 L212 476 Z"/>
      <rect x="318" y="472" width="424" height="326" rx="30"/>
    </g>

    <!-- Chimney smoke -->
    <g fill="#F4EAD7" stroke="#241C17" stroke-width="8">
      <circle cx="678" cy="236" r="16"/>
      <circle cx="700" cy="196" r="24"/>
      <circle cx="714" cy="146" r="32"/>
    </g>

    <!-- Chimney -->
    <rect x="636" y="272" width="68" height="140" rx="8" fill="#E8D3AC" stroke="#241C17" stroke-width="14"/>

    <!-- Roof -->
    <path d="M512 236 L804 462 L220 462 Z" fill="#C4553B" stroke="#241C17" stroke-width="16" stroke-linejoin="round"/>

    <!-- House body -->
    <rect x="300" y="452" width="424" height="336" rx="30" fill="#E8D3AC" stroke="#241C17" stroke-width="16"/>

    <!-- Speech bubble -->
    <path d="M430 532 H594 A44 44 0 0 1 638 576 V664 A44 44 0 0 1 594 708 H486 L452 776 L430 708 A44 44 0 0 1 386 664 V576 A44 44 0 0 1 430 532 Z" fill="#12352A" stroke="#241C17" stroke-width="12" stroke-linejoin="round"/>

    <!-- Reply lines -->
    <g fill="#9BFFB0">
      <rect x="424" y="574" width="176" height="18" rx="9"/>
      <rect x="424" y="614" width="136" height="18" rx="9"/>
      <rect x="424" y="654" width="96" height="18" rx="9"/>
    </g>

    <!-- Ground -->
    <rect x="140" y="784" width="744" height="48" rx="24" fill="#12352A"/>
    <g fill="#9BFFB0">
      <rect x="214" y="760" width="12" height="28" rx="6"/>
      <rect x="236" y="770" width="12" height="18" rx="6"/>
      <rect x="798" y="762" width="12" height="26" rx="6"/>
      <rect x="776" y="772" width="12" height="16" rx="6"/>
    </g>
  </g>
</svg>
